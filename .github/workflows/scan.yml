name: scan and deploy

# Rescans the domain every morning, commits whatever changed, and pushes the
# site to Hostinger over FTPS. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:                        # a hand-edit to the page redeploys too
      - "index.html"
      - "assets/**"
      - "overrides.json"
      - "extras.json"

concurrency:
  group: deploy
  cancel-in-progress: false       # never let two uploads overlap

permissions:
  contents: write                 # the scan commits its own results back
  issues: write                   # the judge asks about what it should not decide

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Puts every public repository that has appeared since the last run to
      # Jev. It changes nothing here: it writes down what it would do, and the
      # next step carries that as a pull request to be looked at. Allowed to
      # fail — a judgement that cannot be made is no reason to stop the deploy.
      - name: Judge new repositories
        id: judge
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node judge.mjs

      # One pull request per run: merging it is the approval, and nothing
      # reaches the board until it is merged. The working tree is put back
      # before the scan, so an unmerged proposal never rides along with it.
      - name: Propose the changes
        if: steps.judge.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node propose.mjs any || exit 0
          branch="judge/$(date -u +%Y-%m-%d-%H%M)"
          counts=$(node propose.mjs count)
          git config user.name "scan"
          git config user.email "scan@users.noreply.github.com"
          git checkout -q -b "$branch"
          node judge.mjs --apply
          git add -A
          git diff --staged --quiet && { git checkout -q main; exit 0; }
          git commit -q -m "judge: ${counts% *} to add"
          git push -q origin "$branch"
          node propose.mjs body > body.md
          gh pr create --base main --head "$branch" --body-file body.md --title "Judge: ${counts% *} to add, ${counts#* } to look at"
          rm -f body.md
          git checkout -q -- .
          git checkout -q main

      # Queries certificate transparency, probes every host, refreshes the
      # logos, rewrites projects.json and rebuilds dist/…zip.
      - name: Scan
        run: node scan.mjs

      # dist/ is gitignored, so hand the zip out here instead: every run leaves a
      # downloadable copy of exactly what it deployed.
      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/radrebeldeveloper.com.zip
          if-no-files-found: error
          retention-days: 14          # private-repo artifact storage is metered

      # Everything the scan touches is generated, so when the branch has moved
      # under us the answer is not to merge but to rebase the working tree onto
      # it: this run's output is the newer truth either way.
      - name: Commit what changed
        run: |
          git config user.name "scan"
          git config user.email "scan@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add -A
            git diff --staged --quiet && { echo "nothing changed"; exit 0; }
            git commit -q -m "scan: refresh projects"
            git push -q origin HEAD:main && exit 0
            echo "branch moved, retrying ($attempt)"
          done
          echo "could not push after three attempts" >&2
          exit 1

      # Uploads index.html, projects.json, assets/ and icons/ over FTPS.
      # The credentials live in the repository's Actions secrets, never here.
      - name: Deploy to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/public_html' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          # Set the repository variable FTP_INSECURE to 1 only if the host serves
          # a certificate for its own name: the upload stays encrypted, but stops
          # verifying who answers.
          FTP_INSECURE: ${{ vars.FTP_INSECURE }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh ftp
